name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# The release job attaches packages to the tag, which the default read-only token
# is not allowed to do.
permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pure helpers: duration parser, backoff thresholds, URL encoding, password
      # masking, and the clamps guarding a hand-edited conffile.
      - name: selftest
        run: sh luci-app-watchplug/root/usr/sbin/watchplug selftest

      # The state machine itself, against a stubbed uci / ping / HTTP device.
      - name: daemon
        run: sh test-daemon.sh

      # Loads the LuCI view the way LuCI does and asserts on what it builds. Every
      # interface regression this project has shipped got past the two steps above:
      # they cannot see the page at all.
      - name: interface
        run: node test-ui.js

  # Two packages, not one per release. The app is LUCI_PKGARCH:=all -- shell and
  # JavaScript, no ABI, no versioned dependency -- so what actually splits the
  # releases is the container format, and there are only two of them: opkg's .ipk up
  # to 24.10, and apk's from 25.12, which replaced opkg.
  #
  # The .ipk is built with the *oldest* supported SDK on purpose: a 21.02 package
  # installs on every later opkg, while a 24.10-built one carries metadata 21.02 may
  # not know. Compatibility runs forward, so build at the floor.
  build:
    name: openwrt ${{ matrix.label }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '21.02.7'
            label: '21.02-24.10'
          - sdk: '25.12.5'
            label: '25.12'
    steps:
      - uses: actions/checkout@v7

      - name: build with the OpenWrt ${{ matrix.sdk }} SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: watchplug
          PACKAGES: luci-app-watchplug

      # Both builds produce the same filename, so the release range goes into the
      # name. The extension is whatever the SDK emitted -- it is the whole point.
      - name: name the package after the releases it covers
        run: |
          mkdir -p dist
          found=0
          for f in $(find . -type f \( -name 'luci-app-watchplug*.ipk' -o -name 'luci-app-watchplug*.apk' \)); do
            cp "$f" "dist/luci-app-watchplug_openwrt-${{ matrix.label }}_all.${f##*.}"
            found=1
          done
          [ "$found" = 1 ] || { echo "no package produced"; find . -name '*.ipk' -o -name '*.apk'; exit 1; }
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
